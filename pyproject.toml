[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoezi-cli"
version = "0.1.0"
description = "JSON-first Zoezi bookings, waitlists and QR check-in for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Marcus Schmidt"}]
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=25"]
dev = ["build>=1.2", "PyYAML>=6", "ruff>=0.9"]

[project.scripts]
zoezi = "zoezi_cli.cli:main"

[project.urls]
Repository = "https://github.com/mar-schmidt/zoezi-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
